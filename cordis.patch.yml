# ============================================================================
# dsh-token-ring —— DSH bundle patch
# ============================================================================
# 挂载声明：DSH 启动时把本插件插进 profile 的配置树。
#
# ⚠️ `name:` 必须是安装后的包名（dsh-token-ring），否则表现为
#    「装上了但设置页没有这一节」。
#
# 设置页位置：DSH 设置 → 用量
# 数据接口：GET /dsh-token-ring/api/stats
# ============================================================================

- insert:
    - id: dsh-token-ring
      name: dsh-token-ring
